  <!-- him -->
  <circle cx="198" cy="166" r="48" fill="currentColor"/>
  <!-- her: head + bun -->
  <circle cx="314" cy="166" r="48" fill="currentColor"/>
  <circle cx="352" cy="124" r="25" fill="currentColor"/>
  <!-- small gaps between heads and shoulders -->
  <path d="M150 218 Q 198 236 246 218" stroke="var(--logo-cut, #fff)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M266 218 Q 314 236 362 218" stroke="var(--logo-cut, #fff)" stroke-width="10" fill="none" stroke-linecap="round"/></svg>